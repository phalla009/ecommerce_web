<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .btn, .btn-filter, .btn-icon, .search-box {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn svg, .btn-filter svg { flex-shrink: 0; }
    .action-buttons { display: flex; align-items: center; gap: 0.5rem; }
    .btn-icon {
      padding: 0.4rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border-color, #e2e8f0);
      background: transparent;
      color: currentColor;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-icon:hover { background-color: var(--hover-bg, #f1f5f9); }
    .btn-icon.btn-edit:hover { color: var(--blue, #2563eb); border-color: #bfdbfe; }
    .btn-icon.btn-delete:hover { color: var(--red, #dc2626); background-color: #fef2f2; border-color: #fca5a5; }
  </style>
</head>
<body>
<div id="toastContainer" class="toast-container"></div>
<div class="shell">
  {% include 'admin/sidebar.html' %}

  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <h1 class="page-title">Categories</h1>
      <div class="topbar-right">
        <div class="search-box">
          <span class="search-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input type="text" id="searchInput" placeholder="Search categories..." />
        </div>
        <button class="btn btn-primary" id="openAddCategoryModalBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>Add Category</span>
        </button>
      </div>
    </header>

    <main class="content">
      <section class="panel">
        <div class="panel-head">
          <h2>Product Categories</h2>
          <div class="panel-actions">
            <button class="btn-filter" id="refreshBtn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
              <span>Refresh</span>
            </button>
          </div>
        </div>

        <table class="ledger-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Category Name</th>
              <th>Description</th>
              <th>Status</th>
              <th>Created At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="categoryTableBody">
            <tr><td colspan="6" style="text-align: center;" class="muted">Loading categories...</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
</div>

<!-- ===== DETAIL MODAL ===== -->
<div class="modal-overlay" id="detailCategoryModal">
  <div class="modal" style="max-width: 500px; width: 90%;">
    <div class="modal-head">
      <h3>Category Details</h3>
      <button class="modal-close" data-close="detailCategoryModal">&times;</button>
    </div>
    <div class="modal-body">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; background: #f8fafc; padding: 0.75rem 1rem; border-radius: 8px;">
        <div>
          <span style="font-size: 0.75rem; color: #64748b; font-weight: 600;">Category ID</span>
          <div id="detailCatId" class="mono" style="font-weight: 700;">#0</div>
        </div>
        <div>
          <span style="font-size: 0.75rem; color: #64748b; font-weight: 600;">Status</span>
          <div id="detailCatStatus">-</div>
        </div>
      </div>
      <div class="form-group">
        <label style="font-weight: 600; font-size: 0.85rem;">Category Name</label>
        <div id="detailCatName" style="font-weight: 600; font-size: 1rem;">-</div>
      </div>
      <div class="form-group">
        <label style="font-weight: 600; font-size: 0.85rem;">Description</label>
        <p id="detailCatDesc" style="margin: 0; white-space: pre-wrap; background: #fff; padding: 0.75rem; border-radius: 6px; border: 1px solid #e2e8f0;">-</p>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label style="font-weight: 600; font-size: 0.85rem;">Created At</label>
        <div id="detailCatCreated" class="muted" style="font-size: 0.875rem;">-</div>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close="detailCategoryModal">Close</button>
      <button type="button" class="btn btn-primary" id="detailCatEditBtn"><span>Edit Category</span></button>
    </div>
  </div>
</div>

<!-- ===== ADD MODAL ===== -->
<div class="modal-overlay" id="addCategoryModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Add New Category</h3>
      <button class="modal-close" data-close="addCategoryModal">&times;</button>
    </div>
    <form id="addCategoryForm">
      <div class="modal-body">
        <div class="form-group">
          <label for="addCatName">Category Name</label>
          <input type="text" id="addCatName" name="name" placeholder="e.g. Electronics" required>
        </div>
        <div class="form-group">
          <label for="addCatDesc">Description</label>
          <input type="text" id="addCatDesc" name="description" placeholder="Brief details...">
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary" data-close="addCategoryModal">Cancel</button>
        <button type="submit" class="btn btn-primary"><span>Save Category</span></button>
      </div>
    </form>
  </div>
</div>

<!-- ===== EDIT MODAL ===== -->
<div class="modal-overlay" id="editCategoryModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Edit Category</h3>
      <button class="modal-close" data-close="editCategoryModal">&times;</button>
    </div>
    <form id="editCategoryForm">
      <div class="modal-body">
        <input type="hidden" id="editCatId">
        <div class="form-group">
          <label for="editCatName">Category Name</label>
          <input type="text" id="editCatName" name="name" required>
        </div>
        <div class="form-group">
          <label for="editCatDesc">Description</label>
          <input type="text" id="editCatDesc" name="description">
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary" data-close="editCategoryModal">Cancel</button>
        <button type="submit" class="btn btn-primary"><span>Update Category</span></button>
      </div>
    </form>
  </div>
</div>

<!-- ===== DELETE MODAL ===== -->
<div class="modal-overlay" id="deleteCategoryModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Delete Category</h3>
      <button class="modal-close" data-close="deleteCategoryModal">&times;</button>
    </div>
    <form id="deleteCategoryForm">
      <div class="modal-body">
        <input type="hidden" id="deleteCatId">
        <p>Are you sure you want to delete category <strong id="deleteCatName" style="color: var(--red);"></strong>?</p>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-secondary" data-close="deleteCategoryModal">Cancel</button>
        <button type="submit" class="btn" style="background-color: var(--red, #dc2626); color: white;"><span>Yes, Delete</span></button>
      </div>
    </form>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script src="/static/js/category.js"></script>
</body>
</html>
