<!-- ===== LOGOUT MODAL ===== -->
<div class="modal-overlay" id="logoutModal">
  <div class="modal" style="max-width: 380px;">
    <div class="modal-head">
      <h3>Confirm Logout</h3>
      <button class="modal-close" data-close="logoutModal" aria-label="Close modal">&times;</button>
    </div>
    <div class="modal-body">
      <p style="color: #334155; margin: 0;">Are you sure you want to log out from your account?</p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close="logoutModal">Cancel</button>
      <button type="button" class="btn" id="confirmLogoutBtn" style="background-color: var(--red, #dc2626); color: white;">
        <span>Yes, Log out</span>
      </button>
    </div>
  </div>
</div>
