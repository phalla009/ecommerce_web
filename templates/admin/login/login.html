<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · KR SYSTEM Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    :root {
      --bg-color: #161e1b;        /* Dark green background matching the theme */
      --card-bg: #1e2924;         /* Muted gray-green for login card */
      --border-color: #2d3b34;    /* Soft border color */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #22c55e;          /* Vibrant green for buttons */
      --accent-hover: #16a34a;
      --error-bg: rgba(220, 38, 38, 0.1);
      --error-text: #ef4444;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Split Container Style */
    .login-container {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.4), 0 8px 10px -6px rgb(0 0 0 / 0.4);
      width: 100%;
      max-width: 850px;
      overflow: hidden;
      margin: 1.5rem;
    }

    /* Left Image Pane */
    .login-image-pane {
      flex: 1;
      background-color: #121816;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 450px;
    }

    .login-image-pane img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }

    /* Right Form Pane */
    .login-form-pane {
      flex: 1;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
    }

    /* Responsive layout: stack vertically on smaller screens */
    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
        max-width: 400px;
      }
      .login-image-pane {
        min-height: 200px;
        max-height: 250px;
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }

    .login-header h1 span {
      color: var(--accent);
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin: 0;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: #121816;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      color: var(--text-main);
      font-size: 0.875rem;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .form-group input::placeholder {
      color: #64748b;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    #errorMsg {
      background-color: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      text-align: center;
      margin-top: 1.25rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Left Image Pane -->
    <div class="login-image-pane">
      <!-- Replace the src attribute with your local image path, e.g., /static/images/login-bg.jpg -->
      <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop" alt="Admin Illustration">
    </div>

    <!-- Right Form Pane -->
    <div class="login-form-pane">
      <div class="login-header">
        <h1>KR SYSTEM<span>.</span></h1>
        <p>Sign in to your admin account</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="name">Username</label>
          <input type="text" id="name" name="name" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
        <div id="errorMsg"></div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, password })
        });

        const result = await response.json();

        if (response.ok && result.code === 200) {
          localStorage.setItem('access_token', result.data.access_token);
          const userRole = result.data.role || (result.data.is_admin ? 'admin' : 'user');
          localStorage.setItem('user_role', userRole);
          window.location.href = '/admin/users';
        } else {
          errorMsg.textContent = result.Message || result.msg || 'Invalid username or password';
          errorMsg.style.display = 'block';
        }
      } catch (error) {
        console.error('Error:', error);
        errorMsg.textContent = 'A technical error occurred. Please try again.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
